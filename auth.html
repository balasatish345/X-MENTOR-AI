<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize | X-MENTOR AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00C853',
                        background: '#000000',
                        surface: '#0a0a0a',
                        navy: '#1a1a2e',
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'glow-slow': 'glow 6s infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            background-image:
                radial-gradient(circle at 50% 10%, #1a1a2e 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(0, 200, 83, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 102, 255, 0.05) 0%, transparent 40%);
            font-family: 'Outfit', 'Inter', sans-serif;
            overflow: hidden;
        }

        .premium-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .neon-border {
            position: relative;
        }

        .neon-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(0, 200, 83, 0.3), transparent);
            z-index: -1;
            border-radius: 2.5rem;
            filter: blur(5px);
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 20px rgba(0, 200, 83, 0.05);
            }

            100% {
                box-shadow: 0 0 50px rgba(0, 200, 83, 0.2);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(0, 200, 83, 0.2);
            border-color: rgba(0, 200, 83, 0.5);
        }

        /* Mesh Background */
        .mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(at 0% 0%, rgba(0, 200, 83, 0.1) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(0, 102, 255, 0.1) 0, transparent 50%);
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-background">
    <div class="mesh"></div>

    <div class="max-w-md w-full relative">
        <!-- Floating Decoratives -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-primary/10 blur-[80px] rounded-full animate-float"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500/10 blur-[80px] rounded-full animate-float"
            style="animation-delay: -3s"></div>

        <!-- Logo -->
        <div class="text-center mb-12 relative animate-fade-in">
            <h1 class="text-5xl font-black tracking-tighter mb-2 text-white">X-MENTOR <span
                    class="text-primary italic">AI</span></h1>
            <div class="flex items-center justify-center gap-4">
                <div class="h-[1px] w-8 bg-white/10"></div>
                <p class="text-white/30 text-[9px] font-black tracking-[0.5em] uppercase">Security Protocol v4.0</p>
                <div class="h-[1px] w-8 bg-white/10"></div>
            </div>
        </div>

        <!-- Auth Card -->
        <div class="premium-glass p-12 rounded-[3.5rem] relative overflow-hidden animate-glow-slow neon-border">
            <!-- Subtle internal shapes -->
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-primary/5 blur-[100px] rounded-full -translate-y-1/2 translate-x-1/2">
            </div>

            <header class="mb-10 relative">
                <h2 class="text-3xl font-black text-white mb-2 uppercase tracking-tight">Identity <span
                        class="text-primary italic">Vault</span></h2>
                <p class="text-white/40 text-[13px] leading-relaxed">Secure access to your personalized AI resource
                    intelligence and mastery progress.</p>
            </header>

            <div class="space-y-6 relative">
                <!-- Google Login -->
                <button id="googleBtn"
                    class="w-full h-16 bg-white text-black font-black rounded-3xl flex items-center justify-center gap-4 hover:bg-primary transition-all duration-500 transform active:scale-95 group relative overflow-hidden">
                    <div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-10 transition-opacity"></div>
                    <svg class="w-5 h-5 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.63l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    <span class="tracking-widest uppercase text-xs">Authorize with Google</span>
                </button>

                <div class="flex items-center gap-6 py-2">
                    <div class="flex-1 h-[1px] bg-white/5"></div>
                    <span class="text-[9px] font-black text-white/10 uppercase tracking-[0.4em]">Encrypted Login</span>
                    <div class="flex-1 h-[1px] bg-white/5"></div>
                </div>

                <!-- Secondary Auth (Mockup for now) -->
                <div class="space-y-4">
                    <div class="relative group">
                        <input type="email" placeholder="NEURAL_EMAIL@USER.COM"
                            class="w-full h-14 bg-white/[0.03] border border-white/10 p-5 rounded-2xl text-[11px] font-bold tracking-widest text-white outline-none transition-all input-glow placeholder:text-white/10 focus:bg-white/[0.05]">
                    </div>
                    <button
                        class="w-full h-14 bg-white/5 border border-white/10 text-white/40 font-black py-4 rounded-2xl text-[10px] tracking-[0.3em] uppercase hover:bg-white/10 hover:text-white transition-all">
                        Request Magic Link
                    </button>
                </div>
            </div>

            <footer class="mt-10 pt-10 border-t border-white/5 relative">
                <p class="text-center text-[9px] text-white/20 font-bold uppercase tracking-[0.25em] leading-relaxed">
                    By accessing the vault, you accept the <br />
                    <a href="#" class="text-primary hover:text-white transition-colors">Terminals of Service</a> & <a
                        href="#" class="text-primary hover:text-white transition-colors">Neural Privacy</a>
                </p>
            </footer>
        </div>

        <!-- Utility Links -->
        <div class="flex justify-center gap-12 mt-12 animate-fade-in" style="animation-delay: 0.5s">
            <a href="index.html"
                class="group flex items-center gap-3 text-white/20 hover:text-primary transition-all duration-500">
                <div
                    class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:border-primary/50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </div>
                <span class="text-[10px] font-black tracking-[0.2em] uppercase">Interface Home</span>
            </a>

            <a href="#"
                class="group flex items-center gap-3 text-white/20 hover:text-blue-400 transition-all duration-500">
                <div
                    class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center group-hover:border-blue-400/50 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="text-[10px] font-black tracking-[0.2em] uppercase">Auth Support</span>
            </a>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="errorToast"
        class="fixed bottom-12 left-1/2 -translate-x-1/2 premium-glass border-red-500/50 text-red-400 px-8 py-4 rounded-3xl text-[10px] font-black tracking-[0.2em] uppercase hidden z-50 flex items-center gap-3 shadow-[0_0_30px_rgba(239,68,68,0.2)]">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="errorMsg">Authentication Failed</span>
    </div>

    <script type="module" src="auth.js"></script>
</body>

</html>
